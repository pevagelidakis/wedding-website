function setLanguage(lang) {
  localStorage.setItem("language", lang);
  applyLanguage(lang);
}

function applyLanguage(lang) {
  const t = translations[lang];
  document.documentElement.lang = lang;

  // Update page texts
  document.getElementById("header").textContent = t.header;
  document.getElementById("subtitle").textContent = t.subtitle;
  document.getElementById("photos_header").textContent = t.photos_header;
  document.getElementById("videos_header").textContent = t.videos_header;
  document.getElementById("status").textContent = t.status;

  // Update modal buttons without breaking events
  const downloadBtn = document.getElementById("downloadBtn");
  const shareBtn = document.getElementById("shareBtn");
  if (downloadBtn) downloadBtn.childNodes[1].textContent = " " + t.downloadBtn;
  if (shareBtn) shareBtn.childNodes[1].textContent = " " + t.shareBtn;

  // Highlight active language button
  document.getElementById("btn-en").style.opacity = lang === "en" ? "1" : "0.5";
  document.getElementById("btn-gr").style.opacity = lang === "gr" ? "1" : "0.5";
}

// Initialize language on page load
document.addEventListener("DOMContentLoaded", () => {
  const savedLang = localStorage.getItem("language") || "en";
  applyLanguage(savedLang);
});
</script>

<script type="module">

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const photoGallery = document.getElementById("photoGallery");
const videoGallery = document.getElementById("videoGallery");
const status = document.getElementById("status");

let loadedFiles = new Set();
const PAGE_SIZE = 100; 
let allFiles = [];
let lastIndex = 0;

let currentFileName = null;
let currentType = "image";

const modal = document.getElementById("mediaModal");
const closeModalBtn = document.getElementById("closeModal");
const downloadBtn = document.getElementById("downloadBtn");

function isMobile() {
  return /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
}

// ================= LOAD MEDIA WITH LAZY PAGINATION =================
async function loadMedia(nextPage = false) {
  if (!nextPage) {
    photoGallery.innerHTML = "";
    videoGallery.innerHTML = "";
    loadedFiles.clear();
    lastIndex = 0;
    status.innerText = "Loading files...";

    const { data, error } = await supabase.storage.from("public-pics").list("", { limit: 10000 });
    if (error) { status.innerText = "Failed to load files"; console.error(error); return; }

    allFiles = [];
    for (const item of data) {
      if (!item.metadata) {
        const { data: folderFiles } = await supabase.storage.from("public-pics").list(item.name, { limit: 1000 });
        if (folderFiles) folderFiles.forEach(f => { if (f.metadata?.size>0) allFiles.push(`${item.name}/${f.name}`); });
      } else if (item.metadata?.size>0) {
        allFiles.push(item.name);
      }
    }

    allFiles.sort((a,b) => b.localeCompare(a));
  }

  const pageFiles = allFiles.slice(lastIndex, lastIndex + PAGE_SIZE);
  lastIndex += PAGE_SIZE;

  if (pageFiles.length === 0) { status.innerText = ""; return; }

  const { data: signedUrls } = await supabase.storage.from("public-pics").createSignedUrls(pageFiles, 3600);

  signedUrls.forEach(item => {
    if (!item.signedUrl || loadedFiles.has(item.path)) return;
    loadedFiles.add(item.path);

    const ext = item.path.toLowerCase();
    if (ext.endsWith(".mp4") || ext.endsWith(".webm") || ext.endsWith(".mov")) {
      createMediaCard(item.path, item.signedUrl, "video");
    } else {
      createMediaCard(item.path, item.signedUrl, "image");
    }
  });

  status.innerText = `Loaded ${Math.min(lastIndex, allFiles.length)} / ${allFiles.length}`;
}

// ================= CREATE MEDIA CARD =================
function createMediaCard(fileName, url, type){
  const card = document.createElement("div");
  card.className = "photo-card fade-in";

  if(type==="video"){
    const videoThumb = document.createElement("video");
    videoThumb.src = url;
    videoThumb.preload="metadata";
    videoThumb.muted = true;
    videoThumb.loop = true;
    videoThumb.classList.add("media-item");
    card.appendChild(videoThumb);
  } else {
    const img = document.createElement("img");
    img.src = url;
    img.loading = "lazy";
    img.classList.add("media-item");
    card.appendChild(img);
  }

  card.addEventListener("click", () => openModal(url, fileName, type));

  if(type==="video") videoGallery.appendChild(card);
  else photoGallery.appendChild(card);
}

// ================= MODAL HANDLING =================
function openModal(url, fileName, type){
  currentURL = url;
  currentFileName = fileName;
  currentType = type;

  modal.style.display = "flex";

  const container = modal.querySelector(".modal-content");
  container.innerHTML = "";

  if(type==="video"){
    const video = document.createElement("video");
    video.src = url;
    video.controls = true;
    video.autoplay = true;
    video.style.width = "100%";
    video.style.height = "auto";
    container.appendChild(video);
  } else {
    const img = document.createElement("img");
    img.src = url;
    container.appendChild(img);
  }

  shareBtn.style.display = isMobile() ? "inline-block" : "none";
}

closeModalBtn.addEventListener("click", ()=>{
  modal.style.display="none";
  const video = modal.querySelector("video");
  if(video) video.pause();
});

// ================= DOWNLOAD =================
downloadBtn.addEventListener("click", async ()=>{
  if(!currentURL) return;
  try{
    const response = await fetch(currentURL);
    const blob = await response.blob();
    const filename = currentFileName || currentURL.split("/").pop().split("?")[0];

    if(isMobile()){
      // Open blob in new tab on mobile
      const blobURL = URL.createObjectURL(blob);
      window.open(blobURL, "_blank");
    } else {
      const file = new File([blob], filename, { type: blob.type });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(file);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

  } catch(err){
    console.error("Download failed", err);
    alert("Download failed.");
  }
});

// ================= SHARE =================
shareBtn.addEventListener("click", async ()=>{
  if(!currentURL || !isMobile()) return;

  try{
    const response = await fetch(currentURL);
    const blob = await response.blob();
    const filename = currentFileName || currentURL.split("/").pop().split("?")[0];
    const mime = currentType==="image" ? blob.type || "image/jpeg" : blob.type || "video/mp4";

    const file = new File([blob], filename, { type: mime });

    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({
        title: "Wedding Memory 🤍",
        text: "Beautiful moment from the wedding ✨",
        files: [file]
      });
    } else alert("Sharing not supported on this device.");

  } catch(err){
    console.error("Share failed:", err);
    alert("Sharing failed or cancelled.");
  }
});

// ================= REAL-TIME UPDATES =================
supabase.channel("storage-changes")
  .on("postgres_changes", { event:"INSERT", schema:"public", table:"uploads", filter:"visibility=eq.public" }, payload=>{
    const filePath = payload.new.file_path;
    if(!loadedFiles.has(filePath)) loadMedia(true);
  })
  .subscribe();

// ================= LAZY LOAD ON SCROLL =================
window.addEventListener("scroll", ()=>{
  if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 200){
    loadMedia(true);
  }
});

// INITIAL LOAD
loadMedia();
</script>
