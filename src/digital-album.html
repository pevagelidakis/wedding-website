<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wedding Memories</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#d4af37;
  --ivory:#f8f6f1;
}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:radial-gradient(circle at top,#1c1c1c,#0d0d0d);
  color:var(--ivory);
  padding:40px 20px;
}

h1{
  font-family:'Playfair Display',serif;
  text-align:center;
  font-size:32px;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  opacity:.7;
  margin-bottom:40px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:30px;
  max-width:1400px;
  margin:0 auto;
}

.photo-card{
  position:relative;
  border-radius:25px;
  overflow:hidden;
  background:#111;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  transition:all .4s ease;
}

.photo-card img{
  width:100%;
  height:320px;
  object-fit:cover;
  display:block;
  transition:transform .6s ease;
}

.photo-card:hover img{
  transform:scale(1.05);
}

.photo-card:hover{
  box-shadow:0 25px 80px rgba(212,175,55,.3);
}

.fade-in{
  animation:fade .6s ease forwards;
  opacity:0;
}

@keyframes fade{
  to{opacity:1;}
}

#status{
  text-align:center;
  margin-top:40px;
  font-size:14px;
  opacity:.6;
}
</style>
</head>

<body>

<h1>Panos & Marianna</h1>
<div class="subtitle">Public Wedding Memories</div>

<div id="gallery" class="gallery"></div>

<p id="status">Updating automatically...</p>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL = "https://qgdifervtqgkmvonawza.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFnZGlmZXJ2dHFna212b25hd3phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4MTU2MDUsImV4cCI6MjA4NjM5MTYwNX0.v_Kf0OWU1F8DC3ThOPaYNne8b6a1EjPpOpGAb4HAvpA";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const gallery = document.getElementById("gallery");
const status = document.getElementById("status");

let currentFiles = new Set();

/* ================= LOAD PHOTOS ================= */
async function loadPhotos_() {

  const { data, error } =
    await supabase.storage
      .from("public-pics")
      .list("", { limit: 1000 });

  console.log("DATA:", data);
  console.log("ERROR:", error);

  if (error) {
    status.innerText = "Error: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    status.innerText = "Bucket returned empty array.";
    return;
  }

  status.innerText = "Files found: " + data.length;
}

async function loadPhotos() {

  gallery.innerHTML = "";
  status.innerText = "Loading...";

  const allFiles = [];

  // 1️⃣ List root
  const { data: rootData, error: rootError } =
    await supabase.storage
      .from("public-pics")
      .list("", { limit: 1000 });

  if (rootError) {
    console.error(rootError);
    status.innerText = "Error: " + rootError.message;
    return;
  }

  for (const item of rootData) {

    // If item is a folder
    if (!item.metadata) {

      const { data: folderFiles } =
        await supabase.storage
          .from("public-pics")
          .list(item.name, { limit: 1000 });

      if (folderFiles) {
        folderFiles.forEach(file => {
          if (file.metadata && file.metadata.size > 0) {
            allFiles.push({
              name: `${item.name}/${file.name}`
            });
          }
        });
      }

    } else {
      // Root-level file
      if (item.metadata.size > 0) {
        allFiles.push({
          name: item.name
        });
      }
    }
  }

  if (allFiles.length === 0) {
    status.innerText = "No photos found in bucket.";
    return;
  }

  // 2️⃣ Display all files
  for (const file of allFiles) {

    const { data: signedData } =
      await supabase.storage
        .from("public-pics")
        .createSignedUrl(file.name, 60);

    if (!signedData) continue;

    const card = document.createElement("div");
    card.className = "photo-card";

    const img = document.createElement("img");
    img.src = signedData.signedUrl;
    img.loading = "lazy";

    card.appendChild(img);
    gallery.appendChild(card);
  }

  status.innerText = "";
}

/* ================= HELPER ================= */

function setsAreEqual(a, b) {
  if (a.size !== b.size) return false;
  for (let item of a) if (!b.has(item)) return false;
  return true;
}

/* ================= AUTO REFRESH ================= */

loadPhotos();
setInterval(loadPhotos, 5000);

</script>

</body>
</html>
