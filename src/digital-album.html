<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wedding Memories</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
  --gold:#d4af37;
  --ivory:#f8f6f1;
}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:
      linear-gradient(rgba(0,0,0,.80), rgba(0,0,0,.90)),
      url('https://images.unsplash.com/photo-1520854221256-17451cc331bf?q=80&w=2000&auto=format&fit=crop') 
      no-repeat center center fixed;
    background-size:cover;
  color:var(--ivory);
  padding:40px 20px;
}

h1{
  font-family:'Playfair Display',serif;
  text-align:center;
  font-size:32px;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  opacity:.7;
  margin-bottom:40px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:30px;
  max-width:1400px;
  margin:0 auto;
}

.photo-card{
  position:relative;
  border-radius:25px;
  overflow:hidden;
  background:#111;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  transition:all .4s ease;
}

.photo-card img{
  width:100%;
  height:320px;
  object-fit:cover;
  display:block;
  transition:transform .6s ease;
}

.photo-card:hover img{
  transform:scale(1.05);
}

.photo-card:hover{
  box-shadow:0 25px 80px rgba(212,175,55,.3);
}

.fade-in{
  animation:fade .6s ease forwards;
  opacity:0;
}

@keyframes fade{
  to{opacity:1;}
}

#status{
  text-align:center;
  margin-top:40px;
  font-size:14px;
  opacity:.6;
}


/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:20px;
}

.modal-content{
  max-width:90%;
  max-height:80%;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 20px 80px rgba(0,0,0,.8);
}

.modal-content img{
  width:100%;
  height:auto;
  display:block;
}

.modal-actions{
  position:absolute;
  bottom:40px;
  display:flex;
  gap:20px;
}

.modal-btn{
  padding:12px 20px;
  border-radius:30px;
  border:none;
  cursor:pointer;
  font-size:14px;
  background:var(--gold);
  color:#000;
  font-weight:600;
}

.close-btn{
  position:absolute;
  top:30px;
  right:30px;
  font-size:28px;
  cursor:pointer;
  color:white;
}

</style>
</head>

<body>

<h1>Panos & Marianna</h1>
<div class="subtitle">Our beautiful Wedding Memories 🤍 Thank you for being part of our story!</div>

<div id="gallery" class="gallery"></div>

<p id="status">Updating automatically...</p>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL = "https://qgdifervtqgkmvonawza.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFnZGlmZXJ2dHFna212b25hd3phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4MTU2MDUsImV4cCI6MjA4NjM5MTYwNX0.v_Kf0OWU1F8DC3ThOPaYNne8b6a1EjPpOpGAb4HAvpA";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const gallery = document.getElementById("gallery");
const status = document.getElementById("status");

let currentFiles = new Set();

/* ================= LOAD PHOTOS ================= */
async function loadPhotos_() {

  const { data, error } =
    await supabase.storage
      .from("public-pics")
      .list("", { limit: 1000 });

  console.log("DATA:", data);
  console.log("ERROR:", error);

  if (error) {
    status.innerText = "Error: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    status.innerText = "Bucket returned empty array.";
    return;
  }

  status.innerText = "Files found: " + data.length;
}

async function loadPhotos2() {

  gallery.innerHTML = "";
  status.innerText = "Loading...";

  const allFiles = [];

  // 1️⃣ List root
  const { data: rootData, error: rootError } =
    await supabase.storage
      .from("public-pics")
      .list("", { limit: 1000 });

  if (rootError) {
    console.error(rootError);
    status.innerText = "Error: " + rootError.message;
    return;
  }

  for (const item of rootData) {

    // If item is a folder
    if (!item.metadata) {

      const { data: folderFiles } =
        await supabase.storage
          .from("public-pics")
          .list(item.name, { limit: 1000 });

      if (folderFiles) {
        folderFiles.forEach(file => {
          if (file.metadata && file.metadata.size > 0) {
            allFiles.push({
              name: `${item.name}/${file.name}`
            });
          }
        });
      }

    } else {
      // Root-level file
      if (item.metadata.size > 0) {
        allFiles.push({
          name: item.name
        });
      }
    }
  }

  if (allFiles.length === 0) {
    status.innerText = "No photos found in bucket.";
    return;
  }

  // 2️⃣ Display all files
  for (const file of allFiles) {

    const { data: signedData } =
      await supabase.storage
        .from("public-pics")
        .createSignedUrl(file.name, 60);

    if (!signedData) continue;

    const card = document.createElement("div");
    card.className = "photo-card";

    const img = document.createElement("img");
    img.src = signedData.signedUrl;
    img.loading = "lazy";

    card.appendChild(img);
    gallery.appendChild(card);
  }

  status.innerText = "";
}
let loadedFiles = new Set();

async function loadPhotos() {

  status.innerText = "Loading...";

  const allFiles = [];

  const { data: rootData, error: rootError } =
    await supabase.storage
      .from("public-pics")
      .list("", { limit: 1000 });

  if (rootError) {
    console.error(rootError);
    status.innerText = "Error: " + rootError.message;
    return;
  }

  for (const item of rootData) {

    // Folder
    if (!item.metadata) {

      const { data: folderFiles } =
        await supabase.storage
          .from("public-pics")
          .list(item.name, { limit: 1000 });

      if (folderFiles) {
        folderFiles.forEach(file => {
          if (file.metadata && file.metadata.size > 0) {
            allFiles.push(`${item.name}/${file.name}`);
          }
        });
      }

    } else {
      // Root file
      if (item.metadata.size > 0) {
        allFiles.push(item.name);
      }
    }
  }

  if (allFiles.length === 0) {
    status.innerText = "No photos found in bucket.";
    return;
  }

  // Sort newest first (important UX improvement)
  allFiles.sort().reverse();

  for (const filePath of allFiles) {

    // 🚫 Prevent duplicates
    if (loadedFiles.has(filePath)) continue;

    await appendPhoto(filePath);
  }

  status.innerText = "";
}

async function appendPhoto(filePath) {

  const { data: signedData } =
    await supabase.storage
      .from("public-pics")
      .createSignedUrl(filePath, 60);

  if (!signedData) return;

  const imageUrl = signedData.signedUrl;

  const card = document.createElement("div");
  card.className = "photo-card fade-in";

  const img = document.createElement("img");
  img.src = imageUrl;
  img.loading = "lazy";

  img.addEventListener("click", () => {
    openModal(imageUrl, filePath);
  });

  card.appendChild(img);

  // New uploads appear on top
  gallery.prepend(card);

  // Mark as loaded
  loadedFiles.add(filePath);
}


/* ================= HELPER ================= */

function setsAreEqual(a, b) {
  if (a.size !== b.size) return false;
  for (let item of a) if (!b.has(item)) return false;
  return true;
}

/* ================= AUTO REFRESH ================= */
const modal = document.getElementById("imageModal");
const modalImage = document.getElementById("modalImage");
const closeModal = document.getElementById("closeModal");
const downloadBtn = document.getElementById("downloadBtn");
const shareBtn = document.getElementById("shareBtn");

let currentImageUrl = null;
let currentFileName = null;

function openModal(url, fileName){
  currentImageUrl = url;
  currentFileName = fileName;

  modalImage.src = url;
  modal.style.display = "flex";
}

closeModal.addEventListener("click", () => {
  modal.style.display = "none";
});

/* ================= DOWNLOAD ================= */

downloadBtn.addEventListener("click", async () => {

  const response = await fetch(currentImageUrl);
  const blob = await response.blob();

  const file = new File([blob], currentFileName, { type: blob.type });

  const link = document.createElement("a");
  link.href = URL.createObjectURL(file);
  link.download = currentFileName;
  link.click();
});

/* ================= SHARE ================= */

shareBtn.addEventListener("click", async () => {

  try {

    const response = await fetch(currentImageUrl);
    const blob = await response.blob();

    const file = new File([blob], currentFileName, { type: blob.type });

    if (navigator.share && navigator.canShare?.({ files:[file] })) {

      await navigator.share({
        title: "Wedding Memory 🤍",
        text: "Beautiful moment from the wedding ✨",
        files:[file]
      });

    } else {

      alert("Sharing not supported on this device.");

    }

  } catch(err){
    console.log("Share cancelled");
  }
});
loadPhotos();
supabase
  .channel("storage-changes")
  .on(
    "postgres_changes",
    {
      event: "INSERT",
      schema: "public",
      table: "uploads", // your uploads table
      filter: "visibility=eq.public"
    },
    (payload) => {
      const filePath = payload.new.file_path;

      if (!loadedFiles.has(filePath)) {
        appendPhoto(filePath);
      }
    }
  )
  .subscribe();
// setInterval(loadPhotos, 5000);

</script>
<div id="imageModal" class="modal">
  <span id="closeModal" class="close-btn">✕</span>
  <div class="modal-content">
    <img id="modalImage" src="" />
  </div>
  <div class="modal-actions">
    <button id="downloadBtn" class="modal-btn"><i class="fa-solid fa-download"></i> Download</button>
    <button id="shareBtn" class="modal-btn"><i class="fa-solid fa-share-nodes"></i> Share</button>
  </div>
</div>
</body>
</html>
