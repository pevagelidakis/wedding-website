<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Save The Date</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&family=Alex+Brush&display=swap&family=GFS+Didot&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #f4f4f4;
  font-family: 'Alex Brush', cursive;
  background:
        url("media/SaveTheDate_pre.jpg") center / cover no-repeat;
  background-size: cover;
  background-position: center;
  background-attachment:scroll;
  }

  /* Maintain exact 1536x2048 ratio */
  .card {
    position: relative;
    width: 100%;
    max-width: 768px; /* scale as needed */
    aspect-ratio: 1536 / 2048;
    margin: auto;
  }

  .language-switch {
  position: absolute;
  top: 20px;
  right: 20px;
}

.language-switch button {
  background: transparent;
  border: 1px solid gold;
  color: gold;
  padding: 5px 10px;
  margin-left: 5px;
  cursor: pointer;
}

.language-switch button:hover {
  background: gold;
  color: black;
}

  /* =============================
     LEFT TEXT BLOCK (calibrated)
     ============================= */

  .left-content {
    position: absolute;
    top: 5.859375%;
    left: 7.8125%;
    color: #111;
  }

  .left-content h1 {
    font-size: clamp(28px, 3vw, 42px);
    font-weight: 400;
    margin-bottom: 12px;
  }

  .left-content h2 {
    font-size: clamp(22px, 2.5vw, 32px);
    font-weight: 400;
    margin-bottom: 40px;
  }

  .names {
    font-size: clamp(24px, 2.8vw, 36px);
    line-height: 1.6;
  }

  /* =============================
     CALENDAR BLOCK (calibrated)
     ============================= */

  .calendar {
    position: absolute;
    top: 5.859375%;
    right: 7.8125%;
    text-align: center;
    color: #111;
  }

  .calendar-header,
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }

  .calendar-header {
    font-size: clamp(12px, 1.2vw, 18px);
    margin-bottom: 10px;
  }

  .calendar-grid {
    gap: clamp(6px, 0.8vw, 12px);
    font-size: clamp(12px, 1.2vw, 18px);
  }

  .day {
    width: clamp(20px, 2vw, 30px);
    height: clamp(20px, 2vw, 30px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .highlight {
    border: 2px solid red;
    border-radius: 50%;
    position: relative;
  }

  .highlight::after {
    content: "❤";
    position: absolute;
    color: red;
    font-size: 0.9em;
    top: -40%;
    right: -40%;
  }

  .heart-day {
  position: relative;
  width: clamp(26px, 2.5vw, 36px);
  height: clamp(24px, 2.3vw, 34px);
}

.heart-day span {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9em;
}

.heart-svg {
  position: absolute;
  width: 100%;
  height: 100%;
}

</style>
</head>
<body>
<div class="language-switch">
  <button onclick="setLanguage('en')" id="btn-en">EN</button>
  <button onclick="setLanguage('gr')" id="btn-gr">GR</button>
</div>
<div class="card">
  <div class="left-content">
    <h1 id="save">Save The Date</h1>
    <h2 id="date">June 2026</h2>
    <div class="names" id="names"></div>
  </div>

  <div class="calendar">
    <div class="calendar-header" id="cal_header"></div>

    <div class="calendar-grid">
      <div></div>
      <div class="day">1</div><div class="day">2</div><div class="day">3</div>
      <div class="day">4</div><div class="day">5</div><div class="day">6</div>

      <div class="day">7</div><div class="day">8</div><div class="day">9</div>
      <div class="day">10</div><div class="day">11</div><div class="day">12</div>
      <div class="day">13</div>

      <div class="day">14</div><div class="day">15</div><div class="day">16</div>
      <div class="day">17</div><div class="day">18</div><div class="day">19</div>
      <div class="day">20</div>

      <div class="day">21</div><div class="day">22</div><div class="day">23</div>
      <div class="day">24</div><div class="day">25</div><div class="day">26</div>
      <div class="day heart-day">
        <svg viewBox="0 0 100 90" class="heart-svg">
            <path d="M50 80
                    L15 45
                    A20 20 0 0 1 50 25
                    A20 20 0 0 1 85 45
                    Z"
                fill="none"
                stroke="red"
                stroke-width="4"/>
        </svg>
        <span>27</span>
     </div>

      <div class="day">28</div><div class="day">29</div><div class="day">30</div>
    </div>
  </div>

</div>


<script>
const translations = {
  en: {
    save:"Save The Date",
    date:"<b>June 2026</b>",
    names:`
    Marianna <br>
      & <br>
    Panagiotis
    `,
    cal_header:`
      <div><b>Sun</b></div><div><b>Mon</b></div><div><b>Tue</b></div>
      <div><b>Wed</b></div><div><b>Thu</b></div><div><b>Fri</b></div><div><b>Sat</b></div>
    `
  },
  gr: {
    save:`<span style="font-family: 'Playfair Display', recursive;">Η Ομορφότερη Ημερομηνία</span>`,
    date:`<b style="font-family: 'Playfair Display', recursive;">Ιούνιος 2026</b>`,
    names:`
      
    <span style="font-family: 'Playfair Display', recursive;"> Μαριάννα </span><br>
      & <br>
    <span style="font-family: 'Playfair Display', recursive;">  Παναγιώτης </span>
    `,
    cal_header:`
      <div><bstyle="font-family: 'Playfair Display', recursive;">Κ</b></div><div><b style="font-family: 'Playfair Display', recursive;">Δ</b></div><div><b style="font-family: 'Playfair Display', recursive;">Τ</b></div>
      <div><bstyle="font-family: 'Playfair Display', recursive;">Τ</b></div><div><b style="font-family: 'Playfair Display', recursive;">Π</b></div><div><b style="font-family: 'Playfair Display', recursive;">Π</b></div><div><b style="font-family: 'Playfair Display', recursive;">Σ</b></div>
    `
  }
};

function setLanguage(lang) {
  localStorage.setItem("language", lang);
  applyLanguage(lang);
}

function applyLanguage(lang) {
  document.documentElement.lang = lang;

  Object.keys(translations[lang]).forEach(id => {
    const element = document.getElementById(id);
    if (element) {
      element.innerHTML = translations[lang][id];
    }
  });

  // Highlight active button
  document.getElementById("btn-en").style.opacity = lang === "en" ? "1" : "0.5";
  document.getElementById("btn-gr").style.opacity = lang === "gr" ? "1" : "0.5";
}

// On page load
document.addEventListener("DOMContentLoaded", () => {
  const savedLang = localStorage.getItem("language") || "en";
  applyLanguage(savedLang);
});
</script>
</body>
</html>
