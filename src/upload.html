<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Capture the Moment</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/png" href="./media/us-married_copy.png">

<style>
:root {
  --gold: #d4af37;
  --ivory: #f8f6f1;
  --glass: rgba(255,255,255,0.08);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background:
    linear-gradient(rgba(0,0,0,.80), rgba(0,0,0,.90)),
    url('https://images.unsplash.com/photo-1520854221256-17451cc331bf?q=80&w=2000&auto=format&fit=crop')
    no-repeat center center fixed;
  background-size: cover;
  color: var(--ivory);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 30px 20px 60px;
  min-height: 100vh;
}

/* ── HEADER ── */
header { position: absolute; top: 0; width: 100%; }

.language-switch { position: absolute; top: 20px; right: 20px; }
.language-switch button {
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--gold);
  padding: 5px 10px;
  margin-left: 5px;
  cursor: pointer;
  border-radius: 4px;
  transition: all .2s;
}
.language-switch button:hover { background: var(--gold); color: #000; }

/* ── TITLES ── */
h2 {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  margin-bottom: 8px;
  text-align: center;
}
.subtitle {
  font-size: 14px;
  opacity: .7;
  margin-bottom: 30px;
  text-align: center;
}

/* ── MODE BUTTONS ── */
.mode-selection {
  display: flex;
  gap: 16px;
  margin-bottom: 30px;
  flex-wrap: wrap;
  justify-content: center;
}

.mode-btn {
  padding: 14px 22px;
  border-radius: 40px;
  border: 1px solid rgba(255,255,255,0.3);
  background: var(--glass);
  backdrop-filter: blur(8px);
  color: var(--ivory);
  font-size: 15px;
  cursor: pointer;
  transition: .2s;
}
.mode-btn:hover {
  transform: scale(1.05);
  border-color: var(--gold);
}

/* ── CAMERA WRAPPER ── */
.camera-wrapper {
  position: relative;
  width: 100%;
  max-width: 420px;
  border-radius: 30px;
  overflow: hidden;
  background: #000;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
  display: none;
}

video, canvas { width: 100%; display: block; }

/* ── CONTROLS ── */
.controls {
  margin-top: 25px;
  display: none;
  justify-content: center;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
}

.switch-btn {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.3);
  background: var(--glass);
  color: var(--ivory);
  font-size: 18px;
  cursor: pointer;
  transition: .2s;
}
.switch-btn:hover { border-color: var(--gold); }

.record-btn {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 0 6px rgba(255,255,255,.2);
  cursor: pointer;
  position: relative;
  border: none;
  transition: transform .15s, background .2s;
}
.record-btn::after {
  content: "";
  position: absolute;
  inset: 18px;
  border-radius: 50%;
  background: #fff;
}
.record-btn.recording {
  background: #b30000;
  transform: scale(1.08);
}

/* ── ACTION BUTTONS ── */
.action-btn {
  padding: 10px 18px;
  border-radius: 30px;
  border: 1px solid rgba(255,255,255,.3);
  background: var(--glass);
  color: var(--ivory);
  font-size: 14px;
  cursor: pointer;
  display: none;
  align-items: center;
  gap: 7px;
  transition: .2s;
}
.action-btn:hover { border-color: var(--gold); color: var(--gold); }
.action-btn:disabled { opacity: .4; cursor: not-allowed; }

/* ── VISIBILITY SELECT ── */
.visibility-group {
  margin-top: 24px;
  width: 100%;
  max-width: 420px;
}
.visibility-group label {
  display: block;
  font-family: 'Playfair Display', serif;
  font-size: 0.95rem;
  margin-bottom: 8px;
  opacity: .8;
}
.visibility-group select {
  width: 100%;
  padding: 14px 16px;
  font-family: 'Playfair Display', serif;
  font-size: 0.95rem;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,0.95);
  color: #111;
  cursor: pointer;
  transition: all .3s ease;
}
.visibility-group select:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(212,175,55,.25);
}

/* ── GALLERY PREVIEW ── */
#galleryPreview {
  display: none;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  padding: 15px;
}

.preview-thumb {
  position: relative;
  width: 100px;
  height: 100px;
  border-radius: 12px;
  overflow: hidden;
  flex-shrink: 0;
}
.preview-thumb img,
.preview-thumb video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.preview-remove {
  position: absolute;
  top: 4px;
  right: 4px;
  background: rgba(0,0,0,.65);
  color: #fff;
  border: none;
  border-radius: 50%;
  width: 22px;
  height: 22px;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .2s;
}
.preview-remove:hover { background: #b30000; }

/* ── PROGRESS ── */
.progress-wrap {
  width: 100%;
  max-width: 420px;
  margin-top: 16px;
  display: none;
}
.progress-wrap.visible { display: block; }
.progress-bar-bg {
  background: rgba(255,255,255,.1);
  border-radius: 10px;
  height: 5px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: var(--gold);
  border-radius: 10px;
  width: 0%;
  transition: width .3s ease;
}
.progress-label {
  text-align: center;
  font-size: 12px;
  opacity: .5;
  margin-top: 5px;
}

/* ── STATUS ── */
#status {
  margin-top: 20px;
  font-size: 14px;
  opacity: .8;
  text-align: center;
  min-height: 20px;
}

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(20,20,20,.95);
  border: 1px solid rgba(212,175,55,.4);
  color: var(--ivory);
  padding: 12px 24px;
  border-radius: 30px;
  font-size: 14px;
  opacity: 0;
  transition: all .3s ease;
  z-index: 999;
  white-space: nowrap;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

<body>
<header>
  <div class="language-switch">
    <button onclick="setLanguage('en')" id="btn-en">EN</button>
    <button onclick="setLanguage('gr')" id="btn-gr">GR</button>
  </div>
</header>

<h2 id="header"></h2>
<div class="subtitle" id="subtitle"></div>

<div id="modeSelection" class="mode-selection">
  <button id="cameraModeBtn" class="mode-btn"></button>
  <button id="galleryModeBtn" class="mode-btn"></button>
</div>

<input type="file" id="fileInput" accept="image/*,video/*" multiple style="display:none;" />

<div class="camera-wrapper">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" style="display:none;"></canvas>
  <div id="galleryPreview"></div>
</div>

<div class="controls">
  <button id="switchBtn" class="switch-btn"><i class="fa-solid fa-camera-rotate"></i></button>
  <button id="recordBtn" class="record-btn"></button>
  <button id="retakeBtn" class="action-btn"><i class="fa-solid fa-arrow-rotate-left"></i> <span id="retakeLbl"></span></button>
  <button id="shareBtn"  class="action-btn"><i class="fa-solid fa-share-nodes"></i> <span id="shareLbl"></span></button>
  <button id="uploadBtn" class="action-btn"><i class="fa-solid fa-arrow-up-from-bracket"></i> <span id="uploadLbl"></span></button>
</div>

<div class="visibility-group">
  <label id="visibilityLabel"></label>
  <select id="visibility">
    <option value="public"  id="optPublic"></option>
    <option value="private" id="optPrivate"></option>
  </select>
</div>
<p class="digital_album"></p>

<div class="progress-wrap" id="progressWrap">
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressFill"></div>
  </div>
  <div class="progress-label" id="progressLabel"></div>
</div>

<p id="status"></p>
<div class="toast" id="toast"></div>

<!-- ── i18n ── -->
<script>
const translations = {
  en: {
    header:          "Capture the Moment! 🤩",
    subtitle:        "Tap for photo • Hold for video",
    cameraModeBtn:   "📸 Use Camera",
    galleryModeBtn:  '<i class="fa-solid fa-images"></i> From Files',
    retakeLbl:       "Retake",
    shareLbl:        "Share",
    uploadLbl:       "Upload",
    visibilityLabel: "Content Accessibility",
    optPublic:       "✨ Public Realm (Bring to light! 💡)",
    optPrivate:      "🖤 Classified (For our little eyes only! 👀🫣)",
    digital_album:   `<p style="color:white;">Enjoy our current digital wedding album <a href="./digital-album.html" class="elegant-link">here</a> (LIVE🔴)!</p>`,
  },
  gr: {
    header:          "Απαθανάτισε τη Στιγμή! 🤩",
    subtitle:        "Πατήστε για φωτογραφία • Κρατήστε για βίντεο",
    cameraModeBtn:   "📸 Κάμερα",
    galleryModeBtn:  '<i class="fa-solid fa-images"></i> Από Αρχεία',
    retakeLbl:       "Ξανά!",
    shareLbl:        "Κοινοποίηση",
    uploadLbl:       "Ανέβασμα",
    visibilityLabel: "Προσβασιμότητα Υλικού",
    optPublic:       "✨ Δημόσια · Όλα στο φως!",
    optPrivate:      "🖤 Απόρρητο (Για τα ματάκια μας μόνο! 👀🫣)",
    digital_album:   `<p style="color:white;">Απολαύστε το γαμήλιο λεύκμά μας ζωντανά <a href="./digital-album.html" class="elegant-link">εδώ</a> (LIVE🔴)!</p>`,
  }
};

let currentLang = "en";

function setLanguage(lang) {
  currentLang = lang;
  localStorage.setItem("language", lang);
  applyLanguage(lang);
}

function applyLanguage(lang) {
  const t = translations[lang] || translations.en;
  document.documentElement.lang = lang;

  // Simple text/innerHTML targets — keyed by element id
  const targets = [
    "header", "subtitle", "cameraModeBtn", "galleryModeBtn",
    "retakeLbl", "shareLbl", "uploadLbl",
    "visibilityLabel", "optPublic", "optPrivate", "digital_album"
  ];
  targets.forEach(id => {
    const el = document.getElementById(id);
    if (el && t[id] !== undefined) el.innerHTML = t[id];
  });

  document.getElementById("btn-en").style.opacity = lang === "en" ? "1" : "0.5";
  document.getElementById("btn-gr").style.opacity = lang === "gr" ? "1" : "0.5";
}

document.addEventListener("DOMContentLoaded", () => {
  applyLanguage(localStorage.getItem("language") || "en");
});
</script>

<!-- ── MAIN APP ── -->
<script type="module" src="upload.js">
</script>
</body>
</html>
