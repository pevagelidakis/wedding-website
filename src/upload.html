<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Capture the Moment</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --gold: #d4af37;
  --soft-gold: #e8d8a3;
  --ivory: #f8f6f1;
  --glass: rgba(255,255,255,0.08);
}

body {
  margin:0;
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at top, #1c1c1c, #0d0d0d);
  color: var(--ivory);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:30px 20px;
  min-height:100vh;
}

h2 {
  font-family: 'Playfair Display', serif;
  font-size:28px;
  margin-bottom:25px;
  font-weight:500;
}

.subtitle {
  font-size:14px;
  opacity:0.7;
  margin-bottom:30px;
}

.camera-wrapper {
  position: relative;
  width:100%;
  max-width:420px;
  border-radius:30px;
  overflow:hidden;
  background: black;
  box-shadow:
    0 0 40px rgba(212,175,55,0.15),
    0 20px 60px rgba(0,0,0,0.6);
}

video, canvas {
  width:100%;
  display:block;
}

.controls {
  margin-top:25px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:30px;
}

/* Switch Camera */
.switch-btn {
  width:50px;
  height:50px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,0.3);
  background: var(--glass);
  backdrop-filter: blur(8px);
  color:var(--ivory);
  font-size:18px;
  cursor:pointer;
}

/* Record */
.record-btn {
  width:90px;
  height:90px;
  border-radius:50%;
  background: var(--gold);
  box-shadow:
    0 0 0 6px rgba(255,255,255,0.2),
    0 0 25px rgba(212,175,55,0.6);
  cursor:pointer;
  position:relative;
}

.record-btn::after{
  content:"";
  position:absolute;
  inset:18px;
  border-radius:50%;
  background:#fff;
}

.record-btn.recording {
  background:#b30000;
  transform:scale(1.08);
}

.retake-btn,
.upload-btn,
.share-btn {
  padding:10px 18px;
  border-radius:30px;
  border:1px solid rgba(255,255,255,0.3);
  background: var(--glass);
  backdrop-filter: blur(8px);
  color:var(--ivory);
  font-size:14px;
  cursor:pointer;
}

#status {
  margin-top:25px;
  font-size:14px;
  opacity:0.8;
}
</style>
</head>

<body>

<h2>Capture the Moment</h2>
<div class="subtitle">Tap for photo • Hold for video</div>

<div class="camera-wrapper">
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>
</div>

<div class="controls">
  <button id="switchBtn" class="switch-btn">🔄</button>
  <div id="recordBtn" class="record-btn"></div>

  <button id="retakeBtn" class="retake-btn" style="display:none;">
    🔁 Retake
  </button>

  <button id="shareBtn" class="share-btn" style="display:none;">
    ✨ Share
  </button>

  <button id="uploadBtn" class="upload-btn" style="display:none;">
    ☁ Upload
  </button>
</div>

<p id="status"></p>

<script type="module" src="upload.js"></script>

</body>
</html>
