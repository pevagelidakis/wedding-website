html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden; /* no scroll */
  font-family:'Inter',sans-serif;
  background:
      linear-gradient(rgba(0,0,0,.8), rgba(0,0,0,.9)),
      url('https://images.unsplash.com/photo-1520854221256-17451cc331bf?q=80&w=2000&auto=format&fit=crop') 
      no-repeat center center fixed;
  background-size: cover;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  color: var(--ivory);
}


h2 {
  font-family:'Playfair Display',serif;
  font-size: 24px;
  margin-top: 20px;
  text-align: center;
  margin-top: 10px; /* below header */
  z-index: 5;
}

.subtitle {
  font-size: 14px;
  opacity: .7;
  margin-bottom: 10px;
  text-align: center;
}

/* MODE SELECTION */
.mode-selection {
  display: flex;
  gap: 15px;
  margin-bottom: 5px;
  z-index: 5;
}

.mode-btn {
  padding: 12px 18px;
  border-radius: 40px;
  border: 1px solid rgba(255,255,255,0.3);
  background: var(--glass);
  backdrop-filter: blur(8px);
  color: var(--ivory);
  font-size: 14px;
  cursor: pointer;
  transition: 0.2s;
}

.mode-btn:hover {
  transform: scale(1.05);
  border-color: var(--gold);
}

/* CAMERA WRAPPER */
.camera-wrapper {
  position: relative;
  width: 100%;
  max-width: 420px;
  height: calc(100vh - 120px); /* full screen minus header+controls */
  border-radius: 20px;
  overflow: hidden;
  background: black;
  display: none; /* shown only after mode selection */
  flex-shrink: 0;
}

/* VIDEO & CANVAS */
video, canvas {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

canvas {
  display: none; /* only after taking photo/video */
  position: absolute;
  top: 0;
  left: 0;
}

/* CONTROLS */
.controls {
  position: absolute;
  bottom: 10px;
  display: none;
  justify-content: center;
  align-items: center;
  gap: 15px;
  width: 100%;
  padding: 0 10px;
  box-sizing: border-box;
}

/* .switch-btn, .record-btn, .retake-btn, .upload-btn, .share-btn {
  cursor: pointer;
} */

/* SHARE / BUTTON STYLES */

} */

  background:var(--glass);
  color:var(--ivory);
  font-size:18px;
  cursor:pointer;
}
.retake-btn,
.upload-btn,
.share-btn{
  padding:10px 18px;
  border-radius:30px;
  border:1px solid rgba(255,255,255,.3);
  background:var(--glass);
  color:var(--ivory);
  font-size:14px;
  cursor:pointer;
  display:none;
}

.share-icon {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

.share-btn:hover {
  color: #000;
}

#status {
  font-size: 14px;
  opacity: 0.8;
  text-align: center;
  margin-top: 5px;
}

:root{
  --gold:#d4af37;
  --ivory:#f8f6f1;
  --glass:rgba(255,255,255,0.08);
}

/* header {
  position: absolute;
  top: 0;
  width: 100%;
} */
header {
  position: relative;
  width: 100%;
  z-index: 10;
  display: flex;
  justify-content: flex-end;
  padding: 10px 20px;
  box-sizing: border-box;
}

.language-switch {
  display: flex;
  gap: 5px;
}
/* .language-switch {
  position: absolute;
  top: 20px;
  right: 20px;
} */
.language-switch button {
  background: transparent;
  border: 1px solid gold;
  color: gold;
  padding: 5px 10px;
  margin-left: 5px;
  cursor: pointer;
}

.language-switch button:hover {
  background: gold;
  color: black;
}

.record-btn{
  width:90px;
  height:90px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 0 6px rgba(255,255,255,.2);

}

.record-btn::after{

.rsvp-group label{

.rsvp-group input:focus,
.rsvp-group select:focus,
.rsvp-group textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(198,165,106,0.25);
}

<body>
  <header>
  <div class="language-switch">
    <button onclick="setLanguage('en')" id="btn-en">EN</button>
    <button onclick="setLanguage('gr')" id="btn-gr">GR</button>
  </div>
  </header>
  
<h2 id="header"></h2>
<div class="subtitle" id="subtitle"></div>
<div id="modeSelection" class="mode-selection">
  <button id="cameraModeBtn" class="mode-btn"></button>
  <button id="galleryModeBtn" class="mode-btn"></button>
</div>

<input type="file" id="fileInput" accept="image/*,video/*" multiple style="display:none;" />

<div class="camera-wrapper">
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>
  <div id="galleryPreview" style="display:none; padding:15px; gap:10px; flex-wrap:wrap;"></div>
</div>

<div class="controls">
  <button id="switchBtn" class="switch-btn"><i class="fa-solid fa-camera-rotate"></i></button>
  <div id="recordBtn" class="record-btn"></div>

  <button id="retakeBtn" class="retake-btn"><i class="fa-solid fa-arrow-rotate-left"></i> Retake</button>
  <button id="shareBtn" class="share-btn" aria-label="Share"> <i class="fa-solid fa-share-nodes"></i> Share</button>
  <button id="uploadBtn" class="upload-btn"><i class="fa-solid fa-arrow-up-from-bracket"></i> Upload</button>
</div>
<div class="rsvp-group" id="visibility_">
  <label>Visibility</label>
  <select id="visibility">
    <option value="public" id="public">Public (everyone sees)</option>
    <option value="private" id="private">Private (we only)</option>
  </select>
</div>

<p id="status"></p>

<script>
  const translations = {
  en: {
    header: "Capture the Moment! 🤩",
    subtitle: "Tap for photo • Hold for video",
    cameraModeBtn:"📸 Use Camera",
    galleryModeBtn:`
      <i class="fa-solid fa-images"></i> From Files
    `,
    retakeBtn:`<i class="fa-solid fa-arrow-rotate-left"></i> Retake`,
    shareBtn:`<i class="fa-solid fa-share-nodes"></i> Share`,
    uploadBtn:`<i class="fa-solid fa-arrow-up-from-bracket"></i> Upload`,
    visibility_:`
    <label>Content Accessibility</label>
    <select id="visibility">
      <option value="public"  id="public">✨ Public Realm (Bring to light! 💡)</option>
      <option value="private" id="private">🖤 Classified (For our little eyes only! 👀🫣)</option>
    </select>
    `
  },
  gr: {
    header: "Απαθανάτισε τη Στιγμή! 🤩",
    subtitle: "Πατήστε για φωτογραφία • Κρατήστε για βίντεο",
    cameraModeBtn:"📸 Κάμερα",
    galleryModeBtn:`
      <i class="fa-solid fa-images"></i> Από Αρχεία
    `,
    retakeBtn:`<i class="fa-solid fa-arrow-rotate-left"></i> Πάμε πάλι!`,
    shareBtn:`<i class="fa-solid fa-share-nodes"></i> Κοινοποίηση`,
    uploadBtn:`<i class="fa-solid fa-arrow-up-from-bracket"></i> Ανέβασμα`,
    visibility_:`
    <label>Προσβασιμότητα Υλικού</label>
    <select id="visibility">
      <option value="public"  id="public">✨ Δημόσια · Όλα στο φως!</option>
      <option value="private" id="private">🖤 Απόρρητο (Για τα ματάκια μας μόνο! 👀🫣)</option>
    </select>

    `
  }
};

function setLanguage(lang) {
  localStorage.setItem("language", lang);
  applyLanguage(lang);
}

function applyLanguage(lang) {
  document.documentElement.lang = lang;

  Object.keys(translations[lang]).forEach(id => {
    const element = document.getElementById(id);
    if (element) {
      element.innerHTML = translations[lang][id];
    }
  });

  // Highlight active button
  document.getElementById("btn-en").style.opacity = lang === "en" ? "1" : "0.5";
  document.getElementById("btn-gr").style.opacity = lang === "gr" ? "1" : "0.5";
}

// On page load
document.addEventListener("DOMContentLoaded", () => {
  const savedLang = localStorage.getItem("language") || "en";
  applyLanguage(savedLang);
});
</script>
