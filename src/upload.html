<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Capture the Moment</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#d4af37;
  --ivory:#f8f6f1;
  --glass:rgba(255,255,255,0.08);
}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:radial-gradient(circle at top,#1c1c1c,#0d0d0d);
  color:var(--ivory);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:30px 20px;
  min-height:100vh;
}

h2{
  font-family:'Playfair Display',serif;
  font-size:28px;
  margin-bottom:10px;
}

.subtitle{
  font-size:14px;
  opacity:.7;
  margin-bottom:30px;
}

/* MODE SELECTION */

.mode-selection{
  display:flex;
  gap:20px;
  margin-bottom:30px;
}

.mode-btn{
  padding:14px 22px;
  border-radius:40px;
  border:1px solid rgba(255,255,255,0.3);
  background:var(--glass);
  backdrop-filter:blur(8px);
  color:var(--ivory);
  font-size:15px;
  cursor:pointer;
  transition:.2s;
}

.mode-btn:hover{
  transform:scale(1.05);
  border-color:var(--gold);
}

/* CAMERA */

.camera-wrapper{
  position:relative;
  width:100%;
  max-width:420px;
  border-radius:30px;
  overflow:hidden;
  background:black;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  display:none;
}

video,canvas{
  width:100%;
  display:block;
}

/* CONTROLS */

.controls{
  margin-top:25px;
  display:none;
  justify-content:center;
  align-items:center;
  gap:30px;
}

.switch-btn{
  width:50px;
  height:50px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.3);
  background:var(--glass);
  color:var(--ivory);
  font-size:18px;
  cursor:pointer;
}

.record-btn{
  width:90px;
  height:90px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 0 6px rgba(255,255,255,.2);
  cursor:pointer;
  position:relative;
}

.record-btn::after{
  content:"";
  position:absolute;
  inset:18px;
  border-radius:50%;
  background:#fff;
}

.record-btn.recording{
  background:#b30000;
  transform:scale(1.08);
}

.retake-btn,
.upload-btn,
.share-btn{
  padding:10px 18px;
  border-radius:30px;
  border:1px solid rgba(255,255,255,.3);
  background:var(--glass);
  color:var(--ivory);
  font-size:14px;
  cursor:pointer;
  display:none;
}

.share-icon {
  width: 20px;
  height: 20px;
  fill: currentColor; /* VERY IMPORTANT */
}

.share-btn:hover {
  color: #000;
}

#status{
  margin-top:25px;
  font-size:14px;
  opacity:.8;
}
</style>
</head>

<body>

<h2>Capture the Moment</h2>
<div class="subtitle">Tap for photo • Hold for video</div>

<div id="modeSelection" class="mode-selection">
  <button id="cameraModeBtn" class="mode-btn">📷 Use Camera</button>
  <button id="galleryModeBtn" class="mode-btn">🖼 Upload</button>
</div>

<input type="file" id="fileInput" accept="image/*,video/*" style="display:none;" />

<div class="camera-wrapper">
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>
</div>

<div class="controls">
  <button id="switchBtn" class="switch-btn">🔄</button>
  <div id="recordBtn" class="record-btn"></div>

  <button id="retakeBtn" class="retake-btn">⟳ Retake</button>

  <button class="share-btn" >
  <svg viewBox="0 0 24 24" class="share-icon">
    <path d="..." />
  </svg>
</button>

  <button id="shareBtn" class="share-btn" aria-label="Share">
    <svg viewBox="0 0 24 24" class="share-icon">
    <path d="favicon/share.svg" />
  </svg> Share</button>
  <button id="uploadBtn" class="upload-btn">☁ Upload</button>
</div>

<p id="status"></p>

<script type="module" src="upload.js"></script>
</body>
</html>
