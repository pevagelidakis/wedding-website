<section class="rsvp-section" id="rsvp">
  <h2 class="rsvp-title" id="rsvpTitle"></h2>

  <p class="rsvp-intro" id="rsvp_intro"></p>

  <form
    id="rsvp-form"
    class="rsvp-form"
    action="https://formspree.io/f/xdalkpyr"
    method="POST"
  novalidate>
    <input type="hidden" name="_subject" value="New Wedding RSVP 💍">

    <div class="rsvp-group">
      <label id="name_"></label>
      <input type="text" name="name" required>
    </div>
    <p class="error-message" id="contact_error_name"></p>

    <div class="rsvp-group">
      <label id="mobile"></label>
      <input type="tel" name="phone" id="phone" pattern="[0-9+\s]{7,15}">
    </div>
    <p id="contact_error" class="error-message"></p>

    <div class="rsvp-row">
      <div class="rsvp-group">
        <label id="attend"></label>
        <select name="attendance" id="attendance" required>
          <option value="" disabled selected id="rsvp_reply"></option>
          <option value="Yes" id="yes"></option>
          <option value="No" id="no"></option>
        </select>
      </div>

      <div class="rsvp-group guests-inline" id="guests-group">
        <label id="seats"></label>
        <input
          type="number"
          name="guests"
          min="1"
          max="50"
          placeholder="1"
        required>  
      </div>
    </div>
    <p id="contact_error_attend" class="error-message"></p>
    <div class="rsvp-group" id="msg_2_couple"></div>

    <button type="submit" class="rsvp-button" id="sendBtn"></button>

  </form>

  <div id="rsvp-thankyou" class="rsvp-thankyou" id="rsvp_thankyou" style="display:none;"></div>
</section>

<div id="petal-container"></div>


<h2 id="SaveTheDate">Save The Date</h2>

      </div>
      </div>
    </div>
  </div>
</section>

function setLanguage(lang) {
  localStorage.setItem("language", lang);
  applyLanguage(lang);
}

function applyLanguage(lang) {
  document.documentElement.lang = lang;

  Object.keys(translations[lang]).forEach(id => {
    const element = document.getElementById(id);
    if (element) {
      element.innerHTML = translations[lang][id];
    }
  });

  // Highlight active button
  document.getElementById("btn-en").style.opacity = lang === "en" ? "1" : "0.5";
  document.getElementById("btn-gr").style.opacity = lang === "gr" ? "1" : "0.5";
}

// On page load
document.addEventListener("DOMContentLoaded", () => {
  const savedLang = localStorage.getItem("language") || "en";
  applyLanguage(savedLang);
});

const card = document.getElementById("weddingCard");
card.addEventListener("click", function () {
  this.classList.toggle("flipped");
});
