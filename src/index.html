    <p id="datePlace"></p>

<h2 id="withGreatJoy"></h2>
<section class="invitation" id="invitation"></section>

<h2 id="prewedd"></h2>

    <div class="split-image"><img src="media/Papadopoulos Residence.png" alt="Bride Location" loading="lazy" decoding="async"></div>
    <div class="split-content" id="bride_invitation"></div>

  <div class="map-container">
    <iframe src="https://www.google.com/maps?q=40.313,21.69485&z=16&output=embed" title="Bride location"></iframe>

</section>

<!-- TEAM GROOM -->
<section class="split-section groom-section">

<h2 id="ceremony_afterparty"></h2>

<!-- CEREMONY -->
<section class="split-section church-section">

  </div>
  <div class="split-grid">
    <div class="split-image"><img src="media/Church of Dormition of Mother of God.jpg" alt="Church" style="aspect-ratio:3/3" loading="lazy" decoding="async"></div>
    <div class="split-content"><p style="color:ivory" id="ceremony_text"></p></div>
  </div>

    <iframe src="https://www.google.com/maps?q=40.289608225166745,21.733980503211065&z=16&output=embed" title="Church location"></iframe>
  </div>
</section>

<!-- VENUE -->

    <div class="split-content"><p style="color:ivory" id="venue_text"></p></div>
  </div>
  <div class="map-container">
    <iframe src="https://www.google.com/maps?q=40.302632130350595,21.6707206200951&z=16&output=embed" title="Venue location"></iframe>
  </div>
</section>

<section class="vacations" id="vacations"></section>

<!-- RSVP -->
<section class="rsvp-section" id="rsvp">
  <h2 class="rsvp-title" id="rsvpTitle"></h2>
  <p class="rsvp-intro" id="rsvp_intro"></p>

  <form id="rsvp-form" class="rsvp-form" novalidate>
    <div class="rsvp-group">
      <label id="name_"></label>
      <input type="text" name="name" required>
    </div>
    <p class="error-message" id="contact_error_name"></p>

    <div class="rsvp-group">
      <label id="mobile"></label>
      <input type="tel" name="phone" id="phone" pattern="[0-9+\s]{7,15}">
    </div>
    <p class="error-message" id="contact_error"></p>

    <div class="rsvp-row">
      <div class="rsvp-group">
        <label id="attend"></label>
        <select name="attendance" id="attendance" required>
          <option value="" disabled selected id="rsvp_reply"></option>
          <option value="Yes" id="yes"></option>
          <option value="No"  id="no"></option>
        </select>
      </div>
      <div class="rsvp-group guests-inline" id="guests-group">
        <label id="seats"></label>
        <input type="number" name="guests" min="1" max="50" placeholder="1" required>
      </div>
    </div>
    <p class="error-message" id="contact_error_attend"></p>

    <div class="rsvp-group" id="msg_2_couple"></div>
    <button type="submit" class="rsvp-button" id="sendBtn"></button>
  </form>

  <div class="rsvp-thankyou" id="rsvp_thankyou" style="display:none;"></div>
</section>

<h2 id="SaveTheDate">Save The Date</h2>
<section class="fancy-card-section">

      <div class="flip-card-back">
        <img src="media/wedding-bg.png" alt="Wedding card back" loading="lazy" decoding="async">
      </div>
    </div>
  </div>
</section>

<section class="desktop-message" id="desktop_message"></section>

<footer style="text-align:center;padding:50px 20px;background:#1f1f1f;color:#f5f5f5;" id="footer"></footer>

let currentLang = "en";

function setLanguage(lang) {
  currentLang = lang;
  localStorage.setItem("language", lang);
  applyLanguage(lang);
}

function applyLanguage(lang) {
  const t = translations[lang] || translations.en;
  document.documentElement.lang = lang;

  Object.entries(t).forEach(([id, value]) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (el.tagName === "INPUT" || el.tagName === "TEXTAREA") {
      el.placeholder = value;
    } else {
      el.innerHTML = value;
    }
  });

  document.getElementById("btn-en").style.opacity = lang === "en" ? "1" : "0.5";
  document.getElementById("btn-gr").style.opacity = lang === "gr" ? "1" : "0.5";
}

document.addEventListener("DOMContentLoaded", () => {
  applyLanguage(localStorage.getItem("language") || "en");
});

document.getElementById("weddingCard").addEventListener("click", function () {

});

<script type="module">
// Pinned — same version across all pages — avoids DataCloneError on all browsers
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

const SUPABASE_URL      = "https://qgdifervtqgkmvonawza.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFnZGlmZXJ2dHFna212b25hd3phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4MTU2MDUsImV4cCI6MjA4NjM5MTYwNX0.v_Kf0OWU1F8DC3ThOPaYNne8b6a1EjPpOpGAb4HAvpA";

const supabase    = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const form        = document.getElementById("rsvp-form");
const thankYou    = document.getElementById("rsvp_thankyou");
const attendance  = document.getElementById("attendance");
const guestsGroup = document.getElementById("guests-group");
const nameInput   = form.querySelector("input[name='name']");
const phoneInput  = document.getElementById("phone");
const guestsInput = guestsGroup.querySelector("input");
const errorName   = document.getElementById("contact_error_name");
const errorPhone  = document.getElementById("contact_error");
const errorAttend = document.getElementById("contact_error_attend");
const submitBtn   = form.querySelector("button[type='submit']");

/* ─── SHOW/HIDE GUESTS ───────────────────────────────────── */
attendance.addEventListener("change", () => {
  const yes = attendance.value === "Yes";
  guestsGroup.classList.toggle("visible", yes);
  guestsInput.required = yes;
  if (!yes) guestsInput.value = "";
});

/* ─── SUBMIT ─────────────────────────────────────────────── */
form.addEventListener("submit", async e => {
  e.preventDefault();

  [errorName, errorPhone, errorAttend].forEach(el => el.style.display = "none");
  thankYou.style.display = "none";

  const nameValue       = nameInput.value.trim();
  const phoneValue      = phoneInput.value.trim();
  const attendanceValue = attendance.value;
  const guestsValue     = guestsInput.value ? parseInt(guestsInput.value, 10) : 0;
  const messageValue    = document.getElementById("msg")?.value.trim() || null;
  const isAttending     = attendanceValue === "Yes";

  let hasError = false;
  if (!nameValue)       { errorName.style.display = "block"; hasError = true; }
  if (!attendanceValue) { errorAttend.style.display = "block"; hasError = true; }
  if (isAttending) {
    if (!phoneValue)                   { errorPhone.style.display  = "block"; hasError = true; }
    if (!guestsValue || guestsValue < 1) { errorAttend.style.display = "block"; hasError = true; }
  }
  if (hasError) return;

  const originalLabel  = submitBtn.textContent;
  submitBtn.disabled   = true;
  submitBtn.textContent = "Sending…";

  try {
    await insertWithRetry({
      full_name:      nameValue,
      phone:          isAttending ? phoneValue : null,
      attendance:     isAttending ? "Yes" : "No",
      seats_reserved: isAttending ? guestsValue : null,
      message:        messageValue
    });

    form.style.display     = "none";
    thankYou.style.display = "block";
    floatingPetals(80);

  } catch (err) {
    const msg = err?.message || err?.code || String(err);
    console.error("[RSVP submit]", msg);
    alert("Temporary issue submitting your RSVP. Please try again in a few seconds.");
  } finally {
    submitBtn.disabled    = false;
    submitBtn.textContent = originalLabel;
  }
});

/* ─── INSERT WITH RETRY + TIMEOUT ───────────────────────── */
async function insertWithRetry(payload, maxRetries = 3) {
  for (let attempt = 0; attempt < maxRetries; attempt++) {
    try {
      const { error } = await Promise.race([
        supabase.from("rsvps").insert([payload]),
        new Promise((_, reject) => setTimeout(() => reject(new Error("Request timeout")), 8000))
      ]);
      if (error) throw error;
      return;
    } catch (err) {
      if (attempt >= maxRetries - 1) throw err;
      await new Promise(r => setTimeout(r, 300 * Math.pow(3, attempt)));
    }
  }
}

/* ─── PETALS ─────────────────────────────────────────────── */
function floatingPetals(count = 40) {
  const container = document.getElementById("petals-container");
  if (!container) return;
  const total    = window.innerWidth < 768 ? Math.min(count, 25) : count;
  const fragment = document.createDocumentFragment();

  for (let i = 0; i < total; i++) {
    const petal = document.createElement("div");
    petal.className = "petal";
    petal.style.left = Math.random() * 100 + "vw";
    petal.style.setProperty("--drift",  (Math.random() * 120 - 60) + "px");
    petal.style.setProperty("--rotate", (Math.random() * 720 - 360) + "deg");
    petal.style.animationDuration = (8 + Math.random() * 6) + "s";
    const r = Math.random();
    petal.classList.add(r < 0.33 ? "far" : r < 0.66 ? "mid" : "near");
    petal.classList.add("variant-" + (1 + Math.floor(Math.random() * 3)));
    petal.addEventListener("animationend", () => petal.remove(), { once: true });
    fragment.appendChild(petal);
  }
  container.appendChild(fragment);
}
</script>
