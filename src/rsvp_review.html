<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSVP Review</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/png" href="./media/us-married_copy.png">

  <style>
    :root {
      --gold: #d4af37;
      --ivory: #f8f6f1;
      --green: #90ee90;
      --red: #e74c3c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
      color: white;
      min-height: 100vh;
      padding: 40px 20px 60px;
    }

    /* ── HEADER ── */
    h1 {
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    /* ── STATS BAR ── */
    .stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      flex-wrap: wrap;
      margin-bottom: 36px;
      font-size: 14px;
      opacity: .7;
    }
    .stats span { display: flex; align-items: center; gap: 6px; }
    .stats strong { color: var(--gold); font-size: 20px; }

    /* ── SEARCH + FILTER ── */
    .toolbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 36px;
    }

    .search-box {
      padding: 10px 18px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.06);
      color: white;
      font-size: 14px;
      width: 240px;
      transition: border-color .2s;
    }
    .search-box::placeholder { opacity: .4; }
    .search-box:focus { outline: none; border-color: var(--gold); }

    .filter-btn {
      padding: 10px 20px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.06);
      color: white;
      font-size: 13px;
      cursor: pointer;
      transition: all .2s;
    }
    .filter-btn:hover,
    .filter-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(212,175,55,.08); }

    /* ── GRID ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 28px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ── CARD ── */
    .card-wrapper {
      perspective: 1000px;
    }

    .card {
      position: relative;
      width: 100%;
      height: 240px;
      transform-style: preserve-3d;
      transition: transform 0.65s ease;
      cursor: pointer;
    }
    .card.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 20px;
      padding: 25px;
      background: #1f1f1f;
      box-shadow: 0 15px 35px rgba(0,0,0,.4);
      border: 1px solid rgba(255,255,255,.07);
      transition: border-color .3s ease, box-shadow .3s ease;
    }

    .card-wrapper:hover .card-face {
      border-color: rgba(212,175,55,.8);
      box-shadow: 0 0 28px rgba(212,175,55,.4);
    }

    /* Front */
    .card-front {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 12px;
    }
    .card-front h2 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      margin: 0;
      line-height: 1.3;
    }
    .card-front .guests-hint {
      font-size: 12px;
      opacity: .45;
    }

    /* Status badge */
    .status {
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 20px;
      font-weight: 500;
    }
    .attending {
      background: rgba(144,238,144,.2);
      color: var(--green);
      border: 1px solid rgba(144,238,144,.5);
    }
    .not-attending {
      background: rgba(231,76,60,.2);
      color: var(--red);
      border: 1px solid rgba(231,76,60,.4);
    }

    /* Back */
    .card-back {
      transform: rotateY(180deg);
      font-size: 13px;
      line-height: 1.7;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }
    .card-back p { margin: 0; }
    .label { font-weight: 500; opacity: .55; margin-right: 4px; }

    /* Flip hint */
    .flip-hint {
      position: absolute;
      bottom: 12px;
      right: 14px;
      font-size: 11px;
      opacity: .25;
      pointer-events: none;
    }

    /* ── SKELETON LOADER ── */
    .skeleton {
      background: #1f1f1f;
      border-radius: 20px;
      height: 240px;
      overflow: hidden;
      position: relative;
    }
    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.05) 50%, transparent 100%);
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

    /* ── EMPTY / ERROR ── */
    .empty-state {
      text-align: center;
      opacity: .5;
      margin-top: 60px;
      font-size: 18px;
      grid-column: 1 / -1;
    }

    /* ── REALTIME BADGE ── */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      opacity: .5;
      margin: 0 auto 28px;
      justify-content: center;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .3; }
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(20,20,20,.95);
      border: 1px solid rgba(212,175,55,.4);
      color: var(--ivory);
      padding: 11px 22px;
      border-radius: 30px;
      font-size: 13px;
      opacity: 0;
      transition: all .3s ease;
      z-index: 999;
      white-space: nowrap;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>

<body>
  <h1>Wedding RSVPs</h1>

  <div class="live-badge">
    <div class="live-dot"></div> Live updates
  </div>

  <!-- Stats -->
  <div class="stats" id="statsBar"></div>

  <!-- Search + Filter -->
  <div class="toolbar">
    <input  class="search-box" id="searchBox" type="search" placeholder="Search by name…" />
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="attending">Attending</button>
    <button class="filter-btn" data-filter="not-attending">Not Attending</button>
  </div>

  <div class="grid" id="rsvpGrid"></div>
  <div class="toast" id="toast"></div>

<script type="module">
// Pinned — same version across all pages, avoids DataCloneError
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

/* ─── CONFIG ─────────────────────────────────────────────── */
const SUPABASE_URL      = "https://qgdifervtqgkmvonawza.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFnZGlmZXJ2dHFna212b25hd3phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4MTU2MDUsImV4cCI6MjA4NjM5MTYwNX0.v_Kf0OWU1F8DC3ThOPaYNne8b6a1EjPpOpGAb4HAvpA";

/* ─── STATE ──────────────────────────────────────────────── */
const supabase  = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const grid      = document.getElementById("rsvpGrid");
const statsBar  = document.getElementById("statsBar");
const searchBox = document.getElementById("searchBox");
const toastEl   = document.getElementById("toast");

let allRsvps    = [];     // full dataset
let activeFilter = "all"; // all | attending | not-attending

/* ─── TOAST ──────────────────────────────────────────────── */
let toastTimer;
function toast(msg, duration = 3000) {
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), duration);
}

/* ─── SANITIZE ───────────────────────────────────────────── */
function sanitize(value) {
  if (value === null || value === undefined || value === "") return "—";
  return String(value)
    .replace(/&/g,  "&amp;")
    .replace(/</g,  "&lt;")
    .replace(/>/g,  "&gt;")
    .replace(/"/g,  "&quot;")
    .replace(/'/g,  "&#039;");
}

/* ─── STATS ──────────────────────────────────────────────── */
function renderStats() {
  const total     = allRsvps.length;
  const attending = allRsvps.filter(r => r.attendance === "Yes").length;
  const guests    = allRsvps.reduce((sum, r) => sum + (parseInt(r.seats_reserved) || 0), 0);

  statsBar.innerHTML = `
    <span><strong>${total}</strong> RSVPs</span>
    <span><strong>${attending}</strong> Attending</span>
    <span><strong>${total - attending}</strong> Not Attending</span>
    <span><strong>${guests}</strong> Total Guests</span>
  `;
}

/* ─── BUILD CARD ELEMENT ─────────────────────────────────── */
function buildCard(rsvp) {
  const isAttending = rsvp.attendance === "Yes";

  const wrapper = document.createElement("div");
  wrapper.className        = "card-wrapper";
  wrapper.dataset.rsvpId   = rsvp.id;
  wrapper.dataset.attending = isAttending ? "attending" : "not-attending";
  wrapper.dataset.name     = (rsvp.full_name || "").toLowerCase();

  const card = document.createElement("div");
  card.className = "card";

  const ts = rsvp.timestamp
    ? new Date(rsvp.timestamp).toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" })
    : "—";

  card.innerHTML = `
    <div class="card-face card-front">
      <h2>${sanitize(rsvp.full_name)}</h2>
      <div class="status ${isAttending ? "attending" : "not-attending"}">
        ${isAttending ? "✓ Attending" : "✕ Not Attending"}
      </div>
      <div class="guests-hint">${isAttending ? `${sanitize(rsvp.seats_reserved)} guest(s)` : ""}</div>
      <span class="flip-hint">tap to flip</span>
    </div>
    <div class="card-face card-back">
      <p><span class="label">Name</span>${sanitize(rsvp.full_name)}</p>
      <p><span class="label">Attendance</span>${sanitize(rsvp.attendance)}</p>
      <p><span class="label">Guests</span>${sanitize(rsvp.seats_reserved)}</p>
      <p><span class="label">Phone</span>${sanitize(rsvp.phone)}</p>
      <p><span class="label">Message</span>${sanitize(rsvp.message) !== "—" ? sanitize(rsvp.message) : "<em style='opacity:.4'>None</em>"}</p>
      <p><span class="label">Submitted</span>${ts}</p>
      <span class="flip-hint">tap to flip</span>
    </div>
  `;

  card.addEventListener("click", () => card.classList.toggle("flipped"));
  wrapper.appendChild(card);
  return wrapper;
}

/* ─── RENDER VISIBLE CARDS ───────────────────────────────── */
function renderGrid() {
  const query = searchBox.value.trim().toLowerCase();

  const visible = allRsvps.filter(r => {
    const matchFilter =
      activeFilter === "all" ||
      (activeFilter === "attending"     && r.attendance === "Yes") ||
      (activeFilter === "not-attending" && r.attendance !== "Yes");

    const matchSearch = !query || (r.full_name || "").toLowerCase().includes(query);
    return matchFilter && matchSearch;
  });

  grid.innerHTML = "";

  if (!visible.length) {
    grid.innerHTML = `<div class="empty-state">${
      query ? `No RSVPs matching "${sanitize(query)}"` : "No RSVPs yet."
    }</div>`;
    return;
  }

  visible.forEach(r => grid.appendChild(buildCard(r)));
}

/* ─── SKELETON PLACEHOLDERS ──────────────────────────────── */
function showSkeletons(n = 6) {
  grid.innerHTML = Array(n).fill('<div class="skeleton"></div>').join("");
}

/* ─── INITIAL LOAD ───────────────────────────────────────── */
async function loadRsvps() {
  showSkeletons();

  const { data, error } = await supabase
    .from("rsvps")
    .select("*")
    .order("timestamp", { ascending: false });

  if (error) {
    const msg = error.message || error.code || "unknown error";
    console.error("[loadRsvps]", msg);
    grid.innerHTML = `<div class="empty-state">Failed to load RSVPs: ${sanitize(msg)}</div>`;
    return;
  }

  allRsvps = data ?? [];
  renderStats();
  renderGrid();
}

/* ─── SEARCH ─────────────────────────────────────────────── */
searchBox.addEventListener("input", renderGrid);

/* ─── FILTER BUTTONS ─────────────────────────────────────── */
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.filter;
    renderGrid();
  });
});

/* ─── REALTIME ───────────────────────────────────────────── */
supabase
  .channel("rsvps-realtime")
  .on(
    "postgres_changes",
    { event: "*", schema: "public", table: "rsvps" },
    (payload) => {
      try {
        const { eventType, new: newRow, old: oldRow } = payload;

        if (eventType === "INSERT") {
          allRsvps.unshift(newRow);
          toast(`New RSVP: ${newRow.full_name || "Guest"} — ${newRow.attendance === "Yes" ? "Attending ✓" : "Not Attending"}`);
        }

        if (eventType === "UPDATE") {
          allRsvps = allRsvps.map(r => r.id === newRow.id ? newRow : r);
          toast(`Updated: ${newRow.full_name || "Guest"}`);
        }

        if (eventType === "DELETE") {
          allRsvps = allRsvps.filter(r => r.id !== oldRow.id);
        }

        renderStats();
        renderGrid();
      } catch (err) {
        console.warn("[Realtime] handler error:", err?.message || err);
      }
    }
  )
  .subscribe((status, err) => {
    if (status === "SUBSCRIBED") {
      console.log("[Realtime] RSVP channel subscribed");
    } else if (err) {
      console.warn("[Realtime] Subscription issue:", err?.message || status);
    }
  });

/* ─── KICK OFF ───────────────────────────────────────────── */
loadRsvps();
</script>
</body>
</html>
