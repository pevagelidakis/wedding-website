async function loadFiles_() {

  const { data, error } = await supabase
    .storage
    .from("public-pics")
    .list("", { limit: 1000 });

  if (error) {
    console.error(error);
    status.innerText = "Failed to load files.";
    return;
  }

  gallery.innerHTML = "";
  selectedFiles.clear();

  if (!data || data.length === 0) {
    status.innerText = "No photos found.";
    return;
  }

  // 🔥 Strict filtering
  const validFiles = data.filter(file =>
    file.name &&
    file.id &&                     // must have id
    file.metadata &&               // must have metadata
    file.metadata.size > 0         // must not be empty
  );

  for (const file of validFiles) {

    const { data: signedData, error: signedError } =
      await supabase
        .storage
        .from("public-pics")
        .createSignedUrl(file.name, 60);

    if (signedError) continue;

    createImageCard(file.name, signedData.signedUrl);
  }
}

async function appendPhoto(filePath) {

  const { data: signedData } =
    await supabase.storage
      .from("public-pics")
      .createSignedUrl(filePath, 60);

  if (!signedData) return;

  const imageUrl = signedData.signedUrl;

  const card = document.createElement("div");
  card.className = "photo-card fade-in";

  const img = document.createElement("img");
  img.src = imageUrl;
  img.loading = "lazy";

  img.addEventListener("click", () => {
    openModal(imageUrl, filePath);
  });

  card.appendChild(img);

  // New uploads appear on top
  gallery.prepend(card);

  // Mark as loaded
  selectedFiles.add(filePath);
}

moveBtn.addEventListener("click", async () => {

  if (selectedFiles.size === 0) {
    status.innerText = "No photos selected.";
    return;
  }

  status.innerText = "Processing...";

  for (const fileName of selectedFiles) {

    try {

      // 1️⃣ Download file
      const { data: fileData, error: downloadError } =
        await supabase.storage
          .from("public-pics")
          .download(fileName);

      if (downloadError) throw downloadError;

      // 2️⃣ Upload to private bucket
      const { error: uploadError } =
        await supabase.storage
          .from("private-pics")
          .upload(fileName, fileData, { upsert: true });

      if (uploadError) throw uploadError;

      // 3️⃣ Remove from public bucket
      const { error: deleteError } =
        await supabase.storage
          .from("public-pics")
          .remove([fileName]);

      if (deleteError) throw deleteError;

      // 4️⃣ Update DB
      await supabase
        .from("uploads")
        .update({ visibility: "private" })
        .eq("file_path", fileName);

    } catch (err) {
      console.error("Error moving:", fileName, err);
    }
  }

  status.innerText = "Completed.";

  loadFiles();
});
function createImageCard(fileName, imageUrl) {

  const card = document.createElement("div");
  card.className = "photo-card";

  const img = document.createElement("img");
  img.src = imageUrl;

  card.appendChild(img);

  card.addEventListener("click", () => {

  card.classList.toggle("selected");
  if (selectedFiles.has(fileName)) {
    selectedFiles.delete(fileName);
  } else {
    selectedFiles.add(fileName);
  }

});

  card.addEventListener("click", () => {

    if (selectedFiles.has(fileName)) {
      selectedFiles.delete(fileName);
      card.classList.remove("selected");
    } else {
      selectedFiles.add(fileName);
      card.classList.add("selected");
    }

  });

  gallery.appendChild(card);
}

supabase
  .channel("storage-changes")
  .on(
    "postgres_changes",
    {
      event: "INSERT",
      schema: "public",
      table: "uploads", // your uploads table
      filter: "visibility=eq.public"
    },
    (payload) => {
      const filePath = payload.new.file_path;

      if (!selectedFiles.has(filePath)) {
        appendPhoto(filePath);
      }
    }
  )

<style>
 body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:radial-gradient(circle at top,#1c1c1c,#0d0d0d);

h2{

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:25px;
}

.photo-card{
  position:relative;
  border-radius:20px;
  overflow:hidden;
  cursor:pointer;
  transition:all .35s cubic-bezier(.22,1,.36,1);
  box-shadow:0 10px 40px rgba(0,0,0,.5);
  transform:scale(1);
}

/* ================= HOVER EFFECT ================= */
.photo-card:hover{
  transform:translateY(-8px) scale(1.02);
  box-shadow:
    0 0 0 2px rgba(212,175,55,.4),
    0 25px 60px rgba(212,175,55,.35);
}

/* ================= SELECTED STATE ================= */
.photo-card.selected{
  transform:scale(1.03);
  box-shadow:
    0 0 0 4px #d4af37,
    0 0 40px rgba(212,175,55,.6),
    0 0 80px rgba(212,175,55,.3);
  animation:selectPulse 1.8s ease-in-out infinite;
}

/* ================= IMAGE ================= */
.photo-card img{
  width:100%;
  height:260px;
  object-fit:cover;
  display:block;
  transition:transform .4s ease;
}

.photo-card:hover img{
  transform:scale(1.05);
}

/* ================= PULSE ANIMATION ================= */
@keyframes selectPulse{
  0%{
    box-shadow:
      0 0 0 4px #d4af37,
      0 0 40px rgba(212,175,55,.6),
      0 0 80px rgba(212,175,55,.3);
  }
  50%{
    box-shadow:
      0 0 0 4px #d4af37,
      0 0 60px rgba(212,175,55,.8),
      0 0 120px rgba(212,175,55,.5);
  }
  100%{
    box-shadow:
      0 0 0 4px #d4af37,
      0 0 40px rgba(212,175,55,.6),
      0 0 80px rgba(212,175,55,.3);
  }
}
.photo-card::after{
  content:"✔";
  position:absolute;
  top:12px;
  right:15px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#d4af37;
  color:black;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:16px;
  opacity:0;
  transform:scale(.5);
  transition:all .3s ease;
}

.photo-card.selected::after{
  opacity:1;
  transform:scale(1);
}


button{
  margin-top:40px;
  padding:14px 28px;
  border-radius:40px;
  border:none;
  background:#d4af37;
  color:black;
  font-weight:600;
  cursor:pointer;
  display:block;
  margin-left:auto;
  margin-right:auto;
}

#status{
  text-align:center;
  margin-top:20px;
  opacity:.8;
}
