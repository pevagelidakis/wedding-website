async function loadFiles() {

  status.innerText = "Loading...";

  const { data, error } =
    await supabase.storage
      .from("public-pics")
      .list("", { limit: 1000 });

    return;
  }

  if (!data || data.length === 0) {
    status.innerText = "No files found.";
    return;
  }

  const validFiles = data
    .filter(file => file.name && file.metadata?.size > 0)
    .map(file => file.name);

  validFiles.sort((a,b)=> b.localeCompare(a));

  // 🔥 BATCH SIGNED URL CREATION (FAST + SAFE)
  const { data: signedUrls, error: signError } =
    await supabase.storage
      .from("public-pics")
      .createSignedUrls(validFiles, 3600); // 1 hour; // 5 minutes

    status.innerText = "Signed URL error.";
    return;
  }

  signedUrls.forEach(item => {

    if (!item.signedUrl) return;

    const fileName = item.path;

      data.find(f => f.name === fileName)?.metadata?.mimetype || "";

    } else {
      createMediaCard(fileName, item.signedUrl, "image");
    }

  });

  status.innerText = "";
}

async function appendPhoto(filePath) {

  // Prevent duplicates
  if (loadedFiles?.has(filePath)) return;

  const { data: signedData, error } =
    await supabase.storage
      .from("public-pics")
      .createSignedUrl(filePath, 300); // longer expiry

  if (error || !signedData?.signedUrl) return;

  const mediaUrl = signedData.signedUrl;

  const card = document.createElement("div");
  card.className = "photo-card fade-in";
  card.dataset.file = filePath;

  let element;

  // Detect by extension (fast + reliable)
  const lowerPath = filePath.toLowerCase();

  if (lowerPath.endsWith(".mp4") ||
      lowerPath.endsWith(".webm") ||
      lowerPath.endsWith(".mov")) {

    element = document.createElement("video");
    element.src = mediaUrl;
    element.controls = true;
    element.preload = "metadata";

  } else {

    element = document.createElement("img");
    element.src = mediaUrl;
    element.loading = "lazy";
  }

  element.classList.add("media-item");

  // Remove broken media automatically
  //element.onerror = () => card.remove();

  card.appendChild(element);

  // New uploads appear on top
  gallery.prepend(card);

  // Track loaded
  if (loadedFiles) loadedFiles.add(filePath);
}

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL = "https://qgdifervtqgkmvonawza.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFnZGlmZXJ2dHFna212b25hd3phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4MTU2MDUsImV4cCI6MjA4NjM5MTYwNX0.v_Kf0OWU1F8DC3ThOPaYNne8b6a1EjPpOpGAb4HAvpA";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);


const photoGallery = document.getElementById("photoGallery");
const videoGallery = document.getElementById("videoGallery");
const moveBtn = document.getElementById("moveBtn");
const status = document.getElementById("status");

let selectedFiles = new Set();
let loadedFiles = new Set();

const PAGE_SIZE = 100; // load 100 files per page for 10k+ datasets
let lastIndex = 0;
let allFiles = [];

// ================== LOAD FILES WITH LAZY PAGINATION ==================
async function loadFiles(nextPage = false) {
  if (!nextPage) {
    photoGallery.innerHTML = "";
    videoGallery.innerHTML = "";
    selectedFiles.clear();
    loadedFiles.clear();
    lastIndex = 0;
    status.innerText = "Loading files...";
    
    const { data, error } = await supabase.storage.from("public-pics").list("", { limit: 10000 });
    if (error) { status.innerText = "Failed to load files"; console.error(error); return; }
    allFiles = data.filter(f => f.name && f.metadata?.size > 0).sort((a,b)=>b.name.localeCompare(a.name));
  }

  const pageFiles = allFiles.slice(lastIndex, lastIndex + PAGE_SIZE);
  lastIndex += PAGE_SIZE;

  if (pageFiles.length === 0) { status.innerText = ""; return; }

  // Batch create signed URLs
  const fileNames = pageFiles.map(f => f.name);
  const { data: signedUrls, error: signError } = await supabase.storage.from("public-pics").createSignedUrls(fileNames, 3600);
  if (signError) { console.error(signError); status.innerText = "Signed URL error"; return; }

  signedUrls.forEach(item => {
    const fileMeta = pageFiles.find(f => f.name === item.path);
    if (!item.signedUrl || !fileMeta) return;

    const mimetype = fileMeta.metadata.mimetype || "";
    if (mimetype.startsWith("video")) {
      createMediaCard(item.path, item.signedUrl, "video");
    } else {
      createMediaCard(item.path, item.signedUrl, "image");
    }
  });

  status.innerText = `Loaded ${Math.min(lastIndex, allFiles.length)} / ${allFiles.length}`;
}

// ================== CREATE MEDIA CARD ==================
function createMediaCard(fileName, url, type) {
  if (loadedFiles.has(fileName)) return;
  loadedFiles.add(fileName);

  const card = document.createElement("div");
  card.className = "photo-card";
  card.dataset.file = fileName;

  if (type === "video") {
    const videoThumb = document.createElement("div");
    videoThumb.className = "video-thumb";
    videoThumb.innerText = "▶";
    card.appendChild(videoThumb);
  } else {
    const img = document.createElement("img");
    img.src = url;
    img.loading = "lazy";
    img.classList.add("media-item");
    card.appendChild(img);
  }

  card.addEventListener("click", () => {
    if (selectedFiles.has(fileName)) {
      selectedFiles.delete(fileName);
      card.classList.remove("selected");
    } else {
      selectedFiles.add(fileName);
      card.classList.add("selected");
    }
  });

  if (type === "video") videoGallery.appendChild(card);
  else photoGallery.appendChild(card);
}

// ================== BATCH MOVE TO PRIVATE ==================
moveBtn.addEventListener("click", async () => {
  if (selectedFiles.size === 0) { status.innerText = "No files selected"; return; }
  if (!confirm(`Move ${selectedFiles.size} files to private?`)) return;

  status.innerText = "Moving files...";
  const filesArray = Array.from(selectedFiles);
  const CHUNK = 20;

  for (let i = 0; i < filesArray.length; i += CHUNK) {
    const chunk = filesArray.slice(i, i + CHUNK);

    // 1. Download
    const downloads = await Promise.all(chunk.map(f => supabase.storage.from("public-pics").download(f)));

    // 2. Upload
    const uploads = await Promise.all(downloads.map((res, idx) => {
      if (!res.data) return null;
      return supabase.storage.from("private-pics").upload(chunk[idx], res.data, { upsert: true });
    }));

    // 3. Delete originals
    const { error: deleteError } = await supabase.storage.from("public-pics").remove(chunk);
    if (deleteError) console.error("Delete error:", deleteError);

    // 4. Update DB
    await supabase.from("uploads")
      .update({ bucket: "private-pics", visibility: "private" })
      .in("file_path", chunk);

    // 5. Remove from UI
    chunk.forEach(f => {
      const card = document.querySelector(`.photo-card[data-file="${f}"]`);
      if (card) card.remove();
      selectedFiles.delete(f);
    });
  }

  status.innerText = "Move completed!";
});

// ================== REAL-TIME UPDATES ==================
supabase.channel("storage-changes")
  .on("postgres_changes", { event: "INSERT", schema: "public", table: "uploads", filter: "visibility=eq.public" }, payload => {
    const filePath = payload.new.file_path;
    if (!loadedFiles.has(filePath)) loadFiles(true);
  })
  .subscribe();

// ================== LAZY LOAD ON SCROLL ==================
window.addEventListener("scroll", () => {
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
    loadFiles(true);
  }
});

// INITIAL LOAD
loadFiles();
</script>
