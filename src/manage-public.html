<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manage Public Photos</title>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL = "https://qgdifervtqgkmvonawza.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_ANON_KEY_HERE";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const gallery = document.getElementById("gallery");
const moveBtn = document.getElementById("moveBtn");
const status = document.getElementById("status");

let selectedFiles = new Set();

/* ================= LOAD FILES ================= */

async function loadFiles() {

  const { data, error } = await supabase
    .storage
    .from("public-pics")
    .list("", { limit: 1000 });

  if (error) {
    status.innerText = "Failed to load files";
    return;
  }

  gallery.innerHTML = "";

  for (const file of data) {

    const { data: publicUrlData } = supabase
      .storage
      .from("public-pics")
      .getPublicUrl(file.name);

    const container = document.createElement("div");
    container.className = "photo-item";

    const img = document.createElement("img");
    img.src = publicUrlData.publicUrl;

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";

    checkbox.addEventListener("change", () => {
      if (checkbox.checked) selectedFiles.add(file.name);
      else selectedFiles.delete(file.name);
    });

    container.appendChild(img);
    container.appendChild(checkbox);
    gallery.appendChild(container);
  }
}

/* ================= MOVE FILES ================= */

moveBtn.addEventListener("click", async () => {

  if (selectedFiles.size === 0) {
    status.innerText = "No photos selected.";
    return;
  }

  status.innerText = "Moving files...";

  for (const fileName of selectedFiles) {

    // 1️⃣ Download file from public bucket
    const { data: fileData } = await supabase
      .storage
      .from("public-pics")
      .download(fileName);

    // 2️⃣ Upload to private bucket
    await supabase.storage
      .from("private-pics")
      .upload(fileName, fileData, { upsert: true });

    // 3️⃣ Delete from public bucket
    await supabase.storage
      .from("public-pics")
      .remove([fileName]);

    // 4️⃣ Update DB visibility
    await supabase
      .from("uploads")
      .update({ visibility: "private" })
      .eq("file_path", fileName);
  }

  status.innerText = "Selected photos moved to private.";

  selectedFiles.clear();
  loadFiles();
});

/* ================= INIT ================= */

loadFiles();

</script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#111;
  color:white;
  padding:20px;
}

h2{
  text-align:center;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:15px;
  margin-top:20px;
}

.photo-item{
  position:relative;
}

.photo-item img{
  width:100%;
  border-radius:10px;
}

.photo-item input{
  position:absolute;
  top:8px;
  right:8px;
  width:20px;
  height:20px;
}

button{
  margin-top:20px;
  padding:12px 20px;
  border:none;
  border-radius:30px;
  background:#d4af37;
  cursor:pointer;
  display:block;
  margin-left:auto;
  margin-right:auto;
}

#status{
  text-align:center;
  margin-top:20px;
  opacity:.8;
}
</style>
</head>

<body>

<h2>Manage Public Photos</h2>

<div id="gallery" class="gallery"></div>

<button id="moveBtn">Move Selected to Private</button>

<p id="status"></p>

</body>
</html>
