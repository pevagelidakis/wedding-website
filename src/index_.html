.calculator-section {

    position: relative;
    overflow: hidden;
  }

  .calculator-section::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
      radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),

  .calculator {
    max-width: 750px;
    width: 100%;

    background: rgba(255, 255, 255, 0.03);
    padding: 50px 40px;
    border-radius: 30px;
    backdrop-filter: blur(20px);
    box-shadow: 
      0 30px 80px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.1),

  }

    content: '✈';
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 60px;
    background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
    width: 90px;
    height: 90px;
    border-radius: 50%;
    display: flex;
    align-items: center;

  .calculator label {

    transition: all 0.3s ease;

  }

  .calculator select:focus,
  .calculator input[type="number"]:focus {

    background: rgba(212, 175, 55, 0.08);

    background-position: right 15px center;
    background-size: 20px;
    padding-right: 45px;
  }

    background: #2a2a2a;
    color: #fff;
    padding: 10px;
  }

  .calculator input[type="number"]::placeholder {
    color: rgba(255, 255, 255, 0.3);
  }

  .calculator p {
    color: rgba(212, 175, 55, 0.8);
    font-size: 0.9rem;
    margin: 10px 0;
    padding-left: 5px;
    line-height: 1.6;
  }

    display: none !important;
  }

    margin-top: 35px;
    padding: 30px;
    border-radius: 20px;
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(212, 175, 55, 0.05) 100%);
    border: 2px solid rgba(212, 175, 55, 0.4);
    font-size: 1.1rem;
    color: #f4d03f;
    text-align: center;
    box-shadow: inset 0 2px 10px rgba(212, 175, 55, 0.1);
    animation: fadeInUp 0.5s ease;
    position: relative;
    overflow: hidden;
  }

  .result::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);

  }

  .result strong {
    color: #d4af37;
    font-size: 2rem;
    display: block;
    margin: 15px 0;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    text-shadow: 0 2px 10px rgba(212, 175, 55, 0.5);
  }

    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .input-section {
    background: rgba(0, 0, 0, 0.2);

    margin-top: 20px;
    border: 1px solid rgba(212, 175, 55, 0.15);

      font-size: 40px;

function setLanguage(lang) {
  localStorage.setItem("language", lang);
  applyLanguage(lang);
}

function applyLanguage(lang) {
  document.documentElement.lang = lang;

  Object.entries(translations[lang]).forEach(([id, value]) => {
    const el = document.getElementById(id);
    if (!el) return;

    // If it's input or textarea placeholder
    if (el.tagName === "INPUT" || el.tagName === "TEXTAREA") {
      el.placeholder = value;
    } else {
      el.innerHTML = value;
    }
  });

  // Highlight active button
  document.getElementById("btn-en").style.opacity = lang === "en" ? "1" : "0.5";
  document.getElementById("btn-gr").style.opacity = lang === "gr" ? "1" : "0.5";
}

// On page load
document.addEventListener("DOMContentLoaded", () => {
  const savedLang = localStorage.getItem("language") || "gr";
  applyLanguage(savedLang);
});

card.addEventListener("click", function () {

const flightDestination = document.getElementById("flightDestination");
const transportMethod = document.getElementById("transportMethod");
const transportSection = document.getElementById("transportSection");
const carOptions = document.getElementById("carOptions");
const result = document.getElementById("result");

flightDestination.addEventListener("change", () => {
  if (flightDestination.value) {
    transportSection.classList.remove("hidden");
    transportMethod.value = "";
    carOptions.classList.add("hidden");
    result.innerHTML = "Select your travel options to see estimated costs and guidance";
  } else {
    transportSection.classList.add("hidden");
    carOptions.classList.add("hidden");
    result.innerHTML = "Select your travel options to see estimated costs and guidance";
  }
});

transportMethod.addEventListener("change", () => {
  if (transportMethod.value === "car") {
    carOptions.classList.remove("hidden");
  } else {
    carOptions.classList.add("hidden");
  }
  calculateAndDisplay();
});

document.getElementById("fuelConsumption").addEventListener("input", calculateAndDisplay);
document.getElementById("fuelPrice").addEventListener("input", calculateAndDisplay);
